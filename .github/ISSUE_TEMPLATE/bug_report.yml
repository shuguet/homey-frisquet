name: Bug report
description: Report a problem with Frisquet Connect for Homey Pro.
body:
  - type: markdown
    attributes:
      value: Please omit passwords, account tokens, serial numbers, addresses and alert contacts from reports and screenshots.
  - type: textarea
    id: report
    attributes:
      label: Homey diagnostic report ID (optional)
      description: After reproducing the problem, choose Create Diagnostics Report on Homey's Frisquet Connect app page and send it directly to the developer. Paste the report ID here to link this issue to that report. If the button is missing or older history is needed, use Configure → Advanced → Preview saved history and attach the JSON. If reporting is itself broken, describe that below.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce, expected behavior and what the official Frisquet app shows.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Displayed error or Last command status
