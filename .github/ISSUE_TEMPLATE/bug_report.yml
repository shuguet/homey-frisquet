name: Bug report
description: Report a problem with Frisquet Connect for Homey Pro.
body:
  - type: markdown
    attributes:
      value: Please omit passwords, account tokens, serial numbers, addresses and alert contacts from reports and screenshots.
  - type: textarea
    id: report
    attributes:
      label: Support report
      description: After reproducing the problem, open Frisquet Connect's app settings and prepare a report. Attach the JSON file here, or provide the Homey app diagnostic-report identifier. Versions and hardware details are collected automatically. If reporting is itself broken, describe that below.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce, expected behavior and what the official Frisquet app shows.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Displayed error or Last command status
